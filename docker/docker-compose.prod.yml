version: "3.9"

services:
  # -------------------------
  # PostgreSQL Database
  # -------------------------
  db:
    image: postgres:15-alpine
    container_name: revx_db_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - revx_network
    restart: unless-stopped

  # -------------------------
  # Redis Cache & Broker
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: revx_redis_prod
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - revx_network
    restart: unless-stopped

  # -------------------------
  # Backend (Django + Daphne for WebSocket support)
  # -------------------------
  web:
    image: yomeronepal/revx-backend:latest
    container_name: revx_web_prod
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file:
      - .env
    environment:
      - DEBUG=False
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - revx_network
    restart: unless-stopped

  # -------------------------
  # Frontend (React + Nginx)
  # -------------------------
  frontend:
    image: yomeronepal/revx-frontend:latest
    container_name: revx_frontend_prod
    ports:
      - "5173:5173"
      - "80:80"
    depends_on:
      - web
    networks:
      - revx_network
    restart: unless-stopped

  # -------------------------
  # Celery Worker
  # -------------------------
  celery:
    image: yomeronepal/revx-backend:latest
    container_name: revx_celery_prod
    command: sh -c "celery -A config worker -l info --concurrency=4 -Q celery,scanner,paper_trading,notifications,maintenance,backtesting"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
    networks:
      - revx_network
    restart: unless-stopped

  # -------------------------
  # Celery Beat
  # -------------------------
  celery-beat:
    image: yomeronepal/revx-backend:latest
    container_name: revx_celery_beat_prod
    command: sh -c "celery -A config beat -l info"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
    networks:
      - revx_network
    restart: unless-stopped

  # -------------------------
  # Dozzle - Container Log Viewer
  # -------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: revx_dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_NO_ANALYTICS=true
    networks:
      - revx_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:


networks:
  revx_network:
    driver: bridge
